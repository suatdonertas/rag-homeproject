<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Ad Search</title>
<style>
  :root {
    --ink: #1b1d1f;
    --paper: #f7f5f1;
    --line: #d8d3ca;
    --accent: #2f5233;
    --accent-soft: #e7ede8;
    --muted: #6b6b66;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 64px 24px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  .kicker {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0 0 6px;
  }

  h1 {
    font-size: 30px;
    font-weight: 500;
    line-height: 1.2;
    margin: 0 0 8px;
  }

  .sub {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 40px;
    max-width: 46ch;
    line-height: 1.5;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  textarea {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    resize: vertical;
    min-height: 72px;
    line-height: 1.4;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  button {
    align-self: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover:not(:disabled) { background: #23401f; }
  button:disabled { opacity: 0.55; cursor: default; }

  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #status {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    margin-top: -4px;
  }

  #result {
    margin-top: 32px;
    padding: 28px 30px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    line-height: 1.65;
    font-size: 16px;
    white-space: pre-wrap;
    display: none;
  }

  #result.visible { display: block; }

  #result strong { font-weight: 600; }

  .error {
    color: #9b3a2f;
  }

  @media (prefers-reduced-motion: no-preference) {
    button { transition: background 0.15s ease; }
  }
</style>
</head>
<body>
<main>
  <p class="kicker">RAG over 11 saved job ads</p>
  <h1>Ask something about the job ads</h1>
  <p class="sub">This queries a Pinecone index of saved postings and asks Claude to answer using only what's in them, with sources cited.</p>

  <form id="queryForm">
    <textarea id="question" placeholder="e.g. Which roles mention forward deployed engineering?" required></textarea>
    <button type="submit" id="submitBtn">Ask</button>
  </form>

  <p id="status"></p>
  <div id="result"></div>
</main>

<script>
  const ENDPOINT = "https://h42cyu93qj.execute-api.us-east-1.amazonaws.com";

  const form = document.getElementById("queryForm");
  const questionInput = document.getElementById("question");
  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;

    submitBtn.disabled = true;
    resultEl.classList.remove("visible");
    resultEl.classList.remove("error");
    statusEl.textContent = "Thinking — first request after a while can take up to 30 seconds…";

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || `Request failed (${res.status})`);
      }

      resultEl.textContent = data.answer || "No answer returned.";
      resultEl.classList.add("visible");
      statusEl.textContent = "";
    } catch (err) {
      resultEl.textContent = "Something went wrong: " + err.message;
      resultEl.classList.add("visible", "error");
      statusEl.textContent = "";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
